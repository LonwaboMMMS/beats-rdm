<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status — Reverb Beats</title><link rel="stylesheet" href="/style.css"><style>body{background:#101010;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}.panel{max-width:520px;padding:36px;text-align:center;background:#1b1b1b;border-radius:18px}.panel h1{font-size:30px}.panel p{color:#aaa;line-height:1.6}.panel a{color:#ff7400}</style></head><body><main class="panel"><h1 id="heading">Checking your payment…</h1><p id="message">PayFast has returned you to Reverb Beats. We are waiting for its secure payment notification before enabling your downloads.</p><p><a href="/account.html">Go to My Account</a> · <a href="/">Back to beats</a></p></main><script>const id=new URLSearchParams(location.search).get("order");async function check(){if(!id){document.querySelector("#heading").textContent="Order not found";return}try{const r=await fetch("/api/orders/status?id="+encodeURIComponent(id),{cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"Could not check order");if(d.order.status==="paid"){document.querySelector("#heading").textContent="Payment confirmed";document.querySelector("#message").textContent="Your payment is confirmed. Your purchased downloads are now available in My Account.";return}document.querySelector("#heading").textContent="Payment received — confirmation pending";document.querySelector("#message").textContent="PayFast is still confirming this payment. Your downloads will appear in My Account once confirmation is complete. Refresh this page in a moment."; }catch(e){document.querySelector("#heading").textContent="Checking payment status";document.querySelector("#message").textContent=e.message+" You can check your purchases in My Account."}}check();</script></body></html>
